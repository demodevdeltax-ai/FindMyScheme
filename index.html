<script>

      if (hero) {
        hero.style.position = 'relative';
        var overlay = document.getElementById('hero-gradient-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'hero-gradient-overlay';
          overlay.style.position = 'absolute';
          overlay.style.top = '0';
          overlay.style.left = '0';
          overlay.style.width = '100%';
          overlay.style.height = '100%';
          overlay.style.pointerEvents = 'none';
          overlay.style.background = 'linear-gradient(to right, black 0%, black 25%, transparent 75%)';
          // Adjust z-index to be behind text but above image
          overlay.style.zIndex = '0';

          // If there's an image, put overlay after image
          var img = hero.querySelector('img');
          if (img && img.parentNode === hero) {
            hero.insertBefore(overlay, img.nextSibling);
          } else if (img) {
            img.parentNode.style.position = 'relative';
            overlay.style.zIndex = '1';
            img.parentNode.appendChild(overlay);

        }
      }

  }, 500);
